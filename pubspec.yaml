name: craie
description: "Application de gestion des salles, équipements et réservations."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: WuraMi
      fonts:
        - asset: assets/fonts/WuraMiByGemmaS.ttf
        - asset: assets/fonts/WuraMiByGemmaS-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WuraMiByGemmaS-Bold.ttf
          weight: 700
